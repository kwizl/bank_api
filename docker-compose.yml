services:
  pgAdmin:
    image: dpage/pgadmin4:latest
    container_name: pgAdmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=postgres@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=postgres
    restart: always
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin  # Note: Corrected internal path for newer images
    networks:
      - bank-network

  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=SimpleBankDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_cms:/var/lib/postgresql/data/
    networks:
      - bank-network

networks:
  bank-network:
    driver: bridge

volumes:
  pgadmin_data:
  postgres_data_cms: